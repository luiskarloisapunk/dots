[opener]
zen = [
  { run = "zen %*", desc = "Zen Browser", orphan = true },
]
pptx-to-pdf = [
  { run = "pptx-to-pdf %*", desc = "Convertir a PDF y abrir en Zen", orphan = true },
]
emacs = [
  { run = "emacs %*", desc = "Emacs", orphan = true },
]
rnote = [
  { run = "rnote %*", desc = "Rnote", orphan = true },
]

[open]
prepend_rules = [
  { mime = "image/*",        use = "zen" },
  { mime = "application/pdf", use = "zen" },
  { mime = "text/html",      use = "zen" },
  { mime = "image/svg+xml",  use = "zen" },
  { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = "pptx-to-pdf" },
  { mime = "application/vnd.ms-powerpoint", use = "pptx-to-pdf" },
  { url = "**/*.pptx", use = "pptx-to-pdf" },
  { url = "**/*.ppt",  use = "pptx-to-pdf" },
  { mime = "text/markdown", use = "emacs" },
  { url = "**/*.org",   use = "emacs" },
  { url = "**/*.md",    use = "emacs" },
  { url = "**/*.rnote", use = "rnote" },
]

[plugin]
prepend_previewers = [
  { mime = "text/csv",                  run = "duckdb" },
  { mime = "text/tab-separated-values", run = "duckdb" },
  { mime = "application/json",          run = "duckdb" },
  { mime = "application/x-duckdb",      run = "duckdb" },
  { url = "**/*.parquet",               run = "duckdb" },
  { url = "**/*.xlsx",                  run = "duckdb" },
  { url = "**/*.duckdb",                run = "duckdb" },
  { url = "**/*.db",                    run = "duckdb" },
]

prepend_preloaders = [
  { mime = "text/csv",                  run = "duckdb", multi = false },
  { mime = "text/tab-separated-values", run = "duckdb", multi = false },
  { mime = "application/json",          run = "duckdb", multi = false },
  { url = "**/*.parquet",               run = "duckdb", multi = false },
  { url = "**/*.xlsx",                  run = "duckdb", multi = false },
]
